<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.N. Animation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#050507;color:#fff;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:280px;background:#0b0b0f;border-right:1px solid #1f1f28;display:flex;flex-direction:column;flex:none;z-index:30;transition:.25s}
.logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #1f1f28;font-weight:900}
.logo i{width:28px;height:28px;background:#fff;color:#000;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.proj{padding:12px;border-radius:14px;background:#13131a;border:1px solid #1f1f28;cursor:pointer}
.proj.active{background:#fff;color:#000}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#08080c}
.top{height:56px;border-bottom:1px solid #1f1f28;display:flex;align-items:center;padding:0 14px;gap:8px;background:#0b0b0f;flex:none}
.btn{height:38px;padding:0 16px;border-radius:12px;border:1px solid #252530;background:#191922;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.ai{background:#6d28ff;border-color:#6d28ff}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #1f1f28;overflow:auto;flex:none}
.tab{height:32px;padding:0 14px;border-radius:20px;border:1px solid #252530;background:#13131a;color:#777;font-size:11px;font-weight:700;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.view{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#13131a;border:1px solid #1f1f28;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#0a0a0a}
.input,textarea,select{width:100%;background:#11111a;border:1px solid #252530;border-radius:12px;padding:11px;color:#fff;font-size:13px;outline:none}
.badge{font-size:9px;padding:4px 7px;border-radius:6px;background:#1d1d28;color:#aaa;font-weight:700;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.box{width:100%;max-width:600px;background:#12121a;border:1px solid #252530;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.range{display:flex;align-items:center;gap:12px;background:#11111a;border:1px solid #252530;border-radius:12px;padding:10px 12px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 20px}
.player{background:#000;border:1px solid #1f1f28;border-radius:18px;overflow:hidden;max-width:960px;margin:auto;width:100%}
.screen{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative;overflow:hidden}
.screen h1{font-family:'Bebas Neue';font-size:64px}
.screen.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity.35s}
.ken{animation:ken 3s ease-in-out forwards}@keyframes ken{0%{transform:scale(1)}100%{transform:scale(1.22) translate(-1%,-1%)}}
.pan{animation:pan 2.5s ease-in-out forwards}@keyframes pan{0%{transform:scale(1.1) translateX(5%)}100%{transform:scale(1.2) translateX(-5%)}}
@media(max-width:860px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.burger{display:flex!important}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div class="logo"><i>CN</i> ANIMATION <span style="margin-left:auto;font-size:10px;color:#666" id="sync">LOCAL</span></div>
<div style="padding:12px;display:flex;flex-direction:column;gap:8px">
<button class="btn primary" style="width:100%;height:44px" onclick="openNew()">+ Nouveau projet</button>
<div style="display:flex;gap:6px"><input class="input" id="sbUrl" placeholder="Supabase URL"><input class="input" id="sbKey" placeholder="anon key"></div>
<button class="btn" style="width:100%" onclick="connect()">Connecter cloud</button>
<p style="font-size:10px;color:#666">5 projets max • 200 épisodes</p>
</div>
<div class="list" id="projList"></div>
</div>
<div class="main">
<div class="top">
<button class="btn burger" style="display:none;width:38px;padding:0" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div style="font-weight:700" id="title">Aucun projet</div>
<div style="margin-left:auto;display:flex;gap:6px">
<button class="btn" onclick="exportCurrent()">Export</button>
<button class="btn ai" onclick="openGenEp()">✨ Générer épisode</button>
</div>
</div>
<div class="tabs">
<button class="tab active" onclick="go('dash',this)">Tableau</button>
<button class="tab" onclick="go('lore',this)">Encyclopédie</button>
<button class="tab" onclick="go('seasons',this)">Saisons</button>
<button class="tab" onclick="go('gens',this)">Génériques</button>
<button class="tab" onclick="go('eps',this)">Épisodes</button>
</div>
<div class="view" id="view"></div>
</div>

<div class="modal" id="mProj"><div class="box"><h3>Nouveau projet</h3><input class="input" id="pName" placeholder="Nom"><input class="input" id="pAuthor" placeholder="Auteur"><select id="pType"><option value="anime">Animé</option><option value="cartoon">Cartoon</option></select><textarea id="pSyn" placeholder="Synopsis..."></textarea><div class="row"><button class="btn" onclick="closeM('mProj')">Annuler</button><button class="btn primary" onclick="saveProj()">Créer</button></div></div></div>
<div class="modal" id="mLore"><div class="box"><h3>Fiche</h3><select id="lType"><option value="personnage">Personnage</option><option value="technique">Technique</option><option value="lieu">Lieu</option><option value="organisation">Organisation</option><option value="lore">Lore</option></select><input class="input" id="lName" placeholder="Nom"><input class="input" id="lRole" placeholder="Rôle"><input class="input" id="lImgFile" type="file" accept="image/*" onchange="previewLoreImage(this)"><img id="lImgPreviewImg" style="display:none;width:100%;max-height:220px;object-fit:contain;border-radius:12px"><textarea id="lDesc" placeholder="Description que l'IA va utiliser..."></textarea><div class="row"><button class="btn" onclick="closeM('mLore')">Annuler</button><button class="btn primary" onclick="saveLore()">Enregistrer</button></div></div></div>
<div class="modal" id="mSeason"><div class="box"><h3>Nouvelle saison</h3><input class="input" id="sName" placeholder="Saison 1"><input class="input" type="number" id="sCount" value="12"><textarea id="sTheme" placeholder="Arc..."></textarea><div class="row"><button class="btn" onclick="closeM('mSeason')">Annuler</button><button class="btn primary" onclick="saveSeason()">Créer</button></div></div></div>
<div class="modal" id="mGen"><div class="box"><h3 id="genH">Générique</h3><div class="row"><select id="gType"><option value="opening">Opening</option><option value="ending">Ending</option></select><select id="gSeason"></select></div><input class="input" id="gTitle" placeholder="Titre musique"><textarea id="gMusic" placeholder="Musique..."></textarea><textarea id="gVisual" placeholder="Visuel..."></textarea><label style="font-size:11px;color:#aaa">Logo final opening</label><input class="input" id="gLogoFile" type="file" accept="image/*" onchange="previewGenLogo(this)"><img id="gLogoPreview" style="display:none;width:100%;max-height:140px;object-fit:contain;background:#000;border-radius:12px"><textarea id="gCredits" placeholder="Crédits"></textarea><div class="row"><button class="btn" onclick="closeM('mGen')">Annuler</button><button class="btn primary" onclick="saveGen()">Enregistrer</button></div></div></div>
<div class="modal" id="mEp"><div class="box"><h3>Générer épisode</h3><select id="eSeason"></select><input class="input" id="eTitle" placeholder="Titre"><textarea id="ePrompt" placeholder="Que se passe-t-il?"></textarea><div class="range"><span>Durée</span><input type="range" id="eDur" min="5" max="45" value="15" oninput="document.getElementById('durVal').innerText=this.value+' min'"><b id="durVal">15 min</b></div><div class="row"><button class="btn" onclick="closeM('mEp')">Annuler</button><button class="btn ai" onclick="generate()">✨ Générer</button></div><div id="genState" style="font-size:11px;color:#888"></div></div></div>

<script>
let supa=null,useCloud=false,projects=[],cur=null,curTab='dash',editLore=null,editGen=null,pendingLoreFile=null,pendingGenFile=null,pendingLoreUrl='',pendingGenUrl='';
const DB_NAME='cn-animation-images-v1',DB_STORE='images';
function openImageDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveImageLocal(dataUrl){const db=await openImageDB();const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((a,b)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(dataUrl,id);tx.oncomplete=a;tx.onerror=()=>b(tx.error);});return 'idb:'+id;}
async function getImageLocal(key){if(!key) return ''; if(!key.startsWith('idb:')) return key; try{const db=await openImageDB();return await new Promise((a,b)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(key.slice(4));req.onsuccess=()=>a(req.result||'');req.onerror=()=>b(req.error);});}catch(e){return '';} }
async function uploadToSupabase(file){if(!supa) return ''; const name=Date.now()+'_'+file.name; const {error}=await supa.storage.from('images').upload(name,file,{upsert:true}); if(error){alert('Upload: '+error.message);return '';} const {data:pub}=supa.storage.from('images').getPublicUrl(name); return pub.publicUrl;}
function loadProjects(){try{projects=JSON.parse(localStorage.getItem('cn-animation-v2')||'[]');if(!Array.isArray(projects)) projects=[];}catch(e){projects=[];}cur=projects[0]||null;}
function safePersist(){try{localStorage.setItem('cn-animation-v2',JSON.stringify(projects));if(useCloud&&supa) saveCloud();renderList();render();return true;}catch(e){alert('Stockage plein');return false;}}
function persist(){return safePersist();}
async function resolveImg(key){ if(!key) return ''; if(key.startsWith('http')) return key; if(key.startsWith('idb:')) return await getImageLocal(key); return key; }
async function hydrateImgs(){ document.querySelectorAll('[data-img]').forEach(async el=>{let k=el.getAttribute('data-img');let s=await resolveImg(k); if(s) el.src=s;});}
async function connect(){let u=document.getElementById('sbUrl').value.trim(),k=document.getElementById('sbKey').value.trim();if(!u||!k) return alert('URL + key');supa=supabase.createClient(u,k);useCloud=true;document.getElementById('sync').innerText='CLOUD';try{let {data}=await supa.from('cn_projects').select('*');if(data&&data.length&&data[0].data){projects=data[0].data;cur=projects[0];localStorage.setItem('cn-animation-v2',JSON.stringify(projects));}else{await saveCloud();}}catch(e){}renderList();render();}
async function saveCloud(){if(!supa) return; try{await supa.from('cn_projects').upsert({id:1,data:projects});}catch(e){}}
function openNew(){document.getElementById('mProj').classList.add('open');}
function closeM(id){document.getElementById(id).classList.remove('open'); if(id==='mGen'){editGen=null;pendingGenFile=null;pendingGenUrl='';} if(id==='mLore'){editLore=null;pendingLoreFile=null;pendingLoreUrl='';}}
function saveProj(){let n=document.getElementById('pName').value.trim();if(!n) return alert('Nom');if(projects.length>=5) return alert('5 max');let p={id:Date.now(),name:n,author:document.getElementById('pAuthor').value||'Anonyme',type:document.getElementById('pType').value,synopsis:document.getElementById('pSyn').value,lore:[],saisons:[],generiques:[],episodes:[]};projects.push(p);cur=p;closeM('mProj');persist();}
function renderList(){let el=document.getElementById('projList');el.innerHTML='';projects.forEach(p=>{let d=document.createElement('div');d.className='proj'+(cur&&cur.id===p.id?' active':'');d.innerHTML=`<b style="font-size:13px">${p.name}</b><small style="display:block;color:#888">${p.episodes.length}/200</small>`;d.onclick=()=>{cur=p;renderList();render();};el.appendChild(d);});document.getElementById('title').innerText=cur?cur.name:'Aucun projet';}
function go(t,el){curTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el) el.classList.add('active');render();}
function render(){
 let v=document.getElementById('view'); if(!cur){v.innerHTML=`<div class="empty"><h3>Aucun projet</h3><button class="btn primary" onclick="openNew()">+ Créer</button></div>`;return;}
 if(curTab==='dash') v.innerHTML=`<div class="card"><h3>${cur.name}</h3><p style="font-size:12px;color:#888">${cur.synopsis||''}</p></div>`;
 if(curTab==='lore'){v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Encyclopédie</h3><button class="btn primary" onclick="openLore()">+ Fiche</button></div><div class="grid" style="margin-top:12px">${cur.lore.map((l,i)=>`<div class="card" onclick="openLore(${i})"><img data-img="${l.img||''}" src="https://via.placeholder.com/300x400"><span class="badge">${l.type}</span><b>${l.name}</b><p style="font-size:10px;color:#777">${(l.desc||'').slice(0,80)}</p></div>`).join('')||'Aucune'}</div>`;hydrateImgs();}
 if(curTab==='seasons') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Saisons</h3><button class="btn primary" onclick="document.getElementById('mSeason').classList.add('open')">+ Saison</button></div><div class="grid" style="margin-top:12px">${cur.saisons.map(s=>`<div class="card"><b>${s.name}</b><span class="badge">${cur.generiques.filter(g=>g.saisonId===s.id).length}/2</span><button class="btn" onclick="openGenM('${s.id}')">+ Générique</button></div>`).join('')||'Pas de saison'}</div>`;
 if(curTab==='gens'){v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Génériques</h3><button class="btn primary" onclick="openGenM()">+ Générique</button></div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${cur.generiques.map((g,i)=>{let s=cur.saisons.find(x=>x.id===g.saisonId);return `<div class="card" style="flex-direction:row;align-items:center;gap:12px" onclick="openGenM(null,${i})"><img data-img="${g.logo||''}" style="width:100px;height:60px;object-fit:contain;background:#000"><div style="flex:1"><b>${g.type.toUpperCase()} - ${s?s.name:''} - ${g.title}</b></div><button class="btn" onclick="event.stopPropagation();delGen(${i})">×</button></div>`}).join('')||'Aucun'}</div>`;hydrateImgs();}
 if(curTab==='eps') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Épisodes ${cur.episodes.length}/200</h3><button class="btn ai" onclick="openGenEp()">✨ Générer</button></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${cur.episodes.map((ep,i)=>`<div class="card" style="flex-direction:row;align-items:center"><div style="width:52px;height:52px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">${ep.duration}'</div><div style="flex:1"><b>${ep.title}</b><p style="font-size:11px;color:#777">${ep.prompt.slice(0,60)}</p>${ep.framesPrebuilt?'<span class="badge" style="background:#0a3;color:#fff">SAVED '+ep.framesPrebuilt.length+' images • '+ep.preFps+'/sec</span>':'<span class="badge">Nouveau</span>'}</div><button class="btn primary" onclick="playEp(${i})">▶ Lire</button></div>`).join('')||'Aucun'}</div>`;
}
function openLore(i=null){editLore=i;pendingLoreFile=null;const img=document.getElementById('lImgPreviewImg');img.style.display='none';if(i!==null){let l=cur.lore[i];document.getElementById('lType').value=l.type;document.getElementById('lName').value=l.name;document.getElementById('lRole').value=l.role||'';document.getElementById('lDesc').value=l.desc||''; if(l.img){resolveImg(l.img).then(s=>{img.src=s;img.style.display='block';});}}else{document.getElementById('lType').value='personnage';document.getElementById('lName').value='';document.getElementById('lRole').value='';document.getElementById('lDesc').value='';}document.getElementById('mLore').classList.add('open');}
function previewLoreImage(input){let f=input.files&&input.files[0];if(!f) return; pendingLoreFile=f; let r=new FileReader(); r.onload=()=>{document.getElementById('lImgPreviewImg').src=r.result;document.getElementById('lImgPreviewImg').style.display='block';pendingLoreUrl=r.result;}; r.readAsDataURL(f);}
async function saveLore(){let n=document.getElementById('lName').value.trim();if(!n) return alert('Nom');let old=editLore!==null?cur.lore[editLore]:null; let imgKey=old?old.img:''; if(pendingLoreFile){ if(useCloud) imgKey=await uploadToSupabase(pendingLoreFile); else imgKey=await saveImageLocal(pendingLoreUrl);} let e={id:old?old.id:Date.now(),type:document.getElementById('lType').value,name:n,role:document.getElementById('lRole').value,img:imgKey,desc:document.getElementById('lDesc').value}; if(editLore!==null) cur.lore[editLore]=e; else cur.lore.push(e); closeM('mLore'); persist();}
function saveSeason(){let n=document.getElementById('sName').value.trim();if(!n) return alert('Nom'); cur.saisons.push({id:'s'+Date.now(),name:n,count:parseInt(document.getElementById('sCount').value)||12,theme:document.getElementById('sTheme').value}); closeM('mSeason'); persist();}
function previewGenLogo(input){let f=input.files&&input.files[0]; if(!f) return; pendingGenFile=f; let r=new FileReader(); r.onload=()=>{document.getElementById('gLogoPreview').src=r.result;document.getElementById('gLogoPreview').style.display='block';pendingGenUrl=r.result;}; r.readAsDataURL(f);}
async function openGenM(pre=null,editIdx=null){
 let s=document.getElementById('gSeason'); s.innerHTML=cur.saisons.map(x=>`<option value="${x.id}" ${x.id===pre?'selected':''}>${x.name}</option>`).join('');
 if(editIdx!==null){editGen=editIdx; let g=cur.generiques[editIdx]; document.getElementById('genH').innerText='Modifier'; document.getElementById('gType').value=g.type; s.value=g.saisonId; document.getElementById('gTitle').value=g.title; document.getElementById('gMusic').value=g.music; document.getElementById('gVisual').value=g.visual; document.getElementById('gCredits').value=g.credits; if(g.logo){let src=await resolveImg(g.logo); document.getElementById('gLogoPreview').src=src; document.getElementById('gLogoPreview').style.display='block';}} else {editGen=null; document.getElementById('genH').innerText='Nouveau'; document.getElementById('gTitle').value='';document.getElementById('gMusic').value='';document.getElementById('gVisual').value='';document.getElementById('gCredits').value='';document.getElementById('gLogoPreview').style.display='none';}
 document.getElementById('mGen').classList.add('open');
}
async function saveGen(){
 let sid=document.getElementById('gSeason').value; if(!sid) return alert('Saison'); let type=document.getElementById('gType').value;
 let exists=cur.generiques.find(g=>g.saisonId===sid && g.type===type && cur.generiques.indexOf(g)!==editGen);
 if(exists) return alert(type+' existe déjà pour cette saison (1 max)');
 let logoKey=editGen!==null?cur.generiques[editGen].logo||'':''; if(pendingGenFile){ if(useCloud) logoKey=await uploadToSupabase(pendingGenFile); else logoKey=await saveImageLocal(pendingGenUrl); }
 let obj={id:editGen!==null?cur.generiques[editGen].id:'g'+Date.now(),saisonId:sid,type, title:document.getElementById('gTitle').value,music:document.getElementById('gMusic').value,visual:document.getElementById('gVisual').value,credits:document.getElementById('gCredits').value,logo:logoKey};
 if(editGen!==null) cur.generiques[editGen]=obj; else cur.generiques.push(obj); closeM('mGen'); persist();
}
function delGen(i){if(confirm('Supprimer?')){cur.generiques.splice(i,1); persist();}}
function openGenEp(){if(!cur.saisons.length) return alert('Saison');let sel=document.getElementById('eSeason');sel.innerHTML=cur.saisons.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');document.getElementById('mEp').classList.add('open');}
async function generate(){if(cur.episodes.length>=200) return alert('200 max');let sid=document.getElementById('eSeason').value,title=document.getElementById('eTitle').value.trim()||`Épisode ${cur.episodes.length+1}`,prompt=document.getElementById('ePrompt').value.trim(),dur=parseInt(document.getElementById('eDur').value)||15;if(!prompt) return alert('Prompt');let state=document.getElementById('genState');state.innerText='Génération...';let lore=cur.lore.map(l=>`[${l.type}] ${l.name}: ${l.desc}`).join('\n').slice(0,6000);let saison=cur.saisons.find(s=>s.id===sid);let full=`Anime ${cur.type} "${cur.name}" Synopsis: ${cur.synopsis}. Saison ${saison.name} - ${saison.theme}. LORE: ${lore}. Episode "${title}" dure ${dur}min: ${prompt}. Ecris ${dur*3} plans [LIEU - ACTION] dialogue.`;try{let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'open',messages:[{role:'user',content:full}]})});let d=await r.json();let txt=d.choices?d.choices[0].message.content:await r.text();cur.episodes.push({id:'ep'+Date.now(),saisonId:sid,title,prompt,duration:dur,summary:txt.slice(0,300),generated:txt,createdAt:new Date().toISOString(),framesPrebuilt:null,preFps:null});state.innerText='Prêt';setTimeout(()=>{closeM('mEp');persist();go('eps');},400);}catch(e){state.innerText='Erreur '+e;}}
async function playEp(idx){
 let ep=cur.episodes[idx], op=cur.generiques.find(g=>g.saisonId===ep.saisonId&&g.type==='opening'), ed=cur.generiques.find(g=>g.saisonId===ep.saisonId&&g.type==='ending');
 let v=document.getElementById('view');
 v.innerHTML=`<div class="player"><div class="screen" id="scr"><img id="fA" class="frame"><img id="fB" class="frame"><div style="position:absolute;inset:0;background:linear-gradient(transparent 30%, rgba(0,0,0,.9));z-index:2"></div><div id="capt" style="position:absolute;bottom:0;left:0;right:0;z-index:3;padding:12px;font-size:12px;white-space:pre-wrap"></div><img id="logoShow" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:68%;max-height:42%;z-index:5;display:none"><div id="counter" style="position:absolute;top:10px;left:10px;z-index:4;font-size:10px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:20px"></div><div id="pre" style="position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><h2 id="preTxt" style="font-family:Bebas Neue;font-size:28px">Préparation...</h2><div style="width:70%;height:6px;background:#222;border-radius:10px;overflow:hidden"><div id="preBar" style="height:100%;background:#fff;width:0%"></div></div><div id="preCount" style="font-size:11px;color:#888"></div></div></div><div style="padding:10px;display:flex;gap:6px;align-items:center"><button class="btn" onclick="render()">← Retour</button><div style="display:flex;gap:4px"><button class="btn" onclick="setUnique(1)" id="b1">1/sec</button><button class="btn primary" onclick="setUnique(2)" id="b2">2/sec</button><button class="btn" onclick="setUnique(3)" id="b3">3/sec</button></div><div style="display:flex;gap:4px;margin-left:6px"><button class="btn" onclick="setFluid(12)" id="f12">12 fps</button><button class="btn primary" onclick="setFluid(24)" id="f24">24 fps</button></div><button class="btn primary" id="playBtn" style="margin-left:auto">⏸</button></div></div>`;
 let plans=[]; if(op){plans.push(`[OPENING ${op.title}] ${op.visual}`); op.credits.split('\n').filter(l=>l.trim()).forEach(c=>plans.push(`[CREDIT] ${c}`));} plans=plans.concat(ep.generated.split('\n').filter(l=>l.trim().length>8)); if(ed){plans.push(`[ENDING ${ed.title}] ${ed.visual}`);}
 let uniqueFps=ep.preFps||2, fluidFps=24;
 window.setUnique=(n)=>{uniqueFps=n; document.querySelectorAll('#b1,#b2,#b3').forEach(b=>b.classList.remove('primary')); document.getElementById('b'+n).classList.add('primary'); restartGen(true);};
 window.setFluid=(n)=>{fluidFps=n; document.querySelectorAll('#f12,#f24').forEach(b=>b.classList.remove('primary')); document.getElementById('f'+n).classList.add('primary');};
 let fA=document.getElementById('fA'), fB=document.getElementById('fB'), curImg=fA, nextImg=fB;
 let frames=[], idxFrame=0, playing=true, openingLogoShown=false;
 let logoSrc= op&&op.logo? await resolveImg(op.logo):'';
 function urlFor(txt, seed){return `https://image.pollinations.ai/prompt/${encodeURIComponent(txt.replace(/\[|\]/g,'').slice(0,100)+', cinematic anime key visual, clean lineart, consistent character, no deformation, highly detailed 16:9')}?width=768&height=432&nologo=true&seed=${seed}`;}
 async function restartGen(force=false){
   let totalUnique= ep.duration*60*uniqueFps;
   if(!force && ep.framesPrebuilt && ep.framesPrebuilt.length===totalUnique && ep.preFps===uniqueFps){
     frames=ep.framesPrebuilt; document.getElementById('pre').style.display='none'; startPlay(); return;
   }
   document.getElementById('pre').style.display='flex'; frames=[]; idxFrame=0;
   while(plans.length<totalUnique) plans.push(plans[plans.length % Math.max(1,plans.length-1)]);
   let usePlans=plans.slice(0,totalUnique);
   for(let k=0;k<usePlans.length;k++){
     let url=urlFor(usePlans[k], 1000+k);
     let ok=await new Promise(res=>{let im=new Image(); im.onload=()=>res(true); im.onerror=()=>res(false); im.src=url;});
     frames.push({text:usePlans[k], url});
     document.getElementById('preBar').style.width=((k+1)/usePlans.length*100)+'%';
     document.getElementById('preCount').innerText=`${k+1}/${usePlans.length} images • SAVED auto après`;
     if(k%15===0) await new Promise(r=>setTimeout(r,80));
   }
   document.getElementById('pre').style.display='none'; ep.framesPrebuilt=frames; ep.preFps=uniqueFps; persist(); startPlay();
 }
 function startPlay(){
   let effs=['ken','pan']; let effIdx=0;
   function showUnique(k){
     if(k>=frames.length){ document.getElementById('capt').innerText='FIN — '+ep.title; playing=false; return; }
     document.getElementById('capt').innerText=frames[k].text;
     document.getElementById('counter').innerText=`${k}/${frames.length} • SAVED • ${uniqueFps}/sec • ${fluidFps} fps`;
     nextImg.className='frame '+(effs[effIdx%2]); effIdx++; nextImg.style.opacity=0; nextImg.src=frames[k].url;
     nextImg.onload=()=>{nextImg.style.opacity=1; curImg.style.opacity=0; let t=curImg; curImg=nextImg; nextImg=t;};
     if(!openingLogoShown && op && logoSrc && k===2){ let l=document.getElementById('logoShow'); l.src=logoSrc; l.style.display='block'; setTimeout(()=>l.style.display='none',3000); openingLogoShown=true; }
   }
   showUnique(0);
   let playInterval=setInterval(()=>{ if(!playing) return; idxFrame++; if(idxFrame<frames.length) showUnique(idxFrame); }, 1000/uniqueFps);
   let motionInterval=setInterval(()=>{ if(!playing) return; let s=1.15+Math.sin(Date.now()/600)*0.05; curImg.style.transform=`scale(${s}) translate(${Math.sin(Date.now()/400)*4}px, ${Math.cos(Date.now()/500)*3}px)`; }, 1000/fluidFps);
   document.getElementById('playBtn').onclick=()=>{playing=!playing; document.getElementById('playBtn').innerText=playing?'⏸':'▶';};
 }
 restartGen(false);
}
function exportCurrent(){if(!cur) return;let b=new Blob([JSON.stringify(cur,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cur.name.replace(/\s+/g,'_')+'.json';a.click();}
loadProjects();renderList();render();
</script>
