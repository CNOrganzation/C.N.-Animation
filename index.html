<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.N. Animation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#050507;color:#fff;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:280px;background:#0b0b0f;border-right:1px solid #1f1f28;display:flex;flex-direction:column;flex:none;z-index:40;transition:.25s}
.logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #1f1f28;font-weight:900}
.logo i{width:28px;height:28px;background:#fff;color:#000;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.proj{padding:12px;border-radius:14px;background:#13131a;border:1px solid #1f1f28;cursor:pointer}
.proj.active{background:#fff;color:#000}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#08080c}
.top{height:56px;border-bottom:1px solid #1f1f28;display:flex;align-items:center;padding:0 14px;gap:8px;background:#0b0b0f;flex:none}
.btn{height:38px;padding:0 16px;border-radius:12px;border:1px solid #252530;background:#191922;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.ai{background:#6d28ff;border-color:#6d28ff}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #1f1f28;overflow:auto;flex:none}
.tab{height:32px;padding:0 14px;border-radius:20px;border:1px solid #252530;background:#13131a;color:#777;font-size:11px;font-weight:700;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.view{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#13131a;border:1px solid #1f1f28;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#0a0a0a}
.input,textarea,select{width:100%;background:#11111a;border:1px solid #252530;border-radius:12px;padding:11px;color:#fff;font-size:13px;outline:none}
.badge{font-size:9px;padding:4px 7px;border-radius:6px;background:#1d1d28;color:#aaa;font-weight:700;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.box{width:100%;max-width:600px;background:#12121a;border:1px solid #252530;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.range{display:flex;align-items:center;gap:12px;background:#11111a;border:1px solid #252530;border-radius:12px;padding:10px 12px}
.player{background:#000;border:1px solid #1f1f28;border-radius:18px;overflow:hidden;max-width:960px;margin:auto;width:100%}
.screen{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative;overflow:hidden}
.screen.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity.35s}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
#overlay.show{display:block}
@media(max-width:860px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.burger{display:flex!important}}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:700;z-index:200;display:none}
</style>
</head>
<body>
<div id="toast"></div>
<div class="sidebar" id="sidebar">
<div class="logo"><i>CN</i> ANIMATION <span style="font-size:10px;color:#666" id="sync">LOCAL</span><button class="btn burger" style="display:none;width:32px;height:32px;padding:0;margin-left:auto" onclick="closeSide()">✕</button></div>
<div style="padding:12px;display:flex;flex-direction:column;gap:8px">
<button class="btn primary" style="width:100%;height:44px" onclick="openNew()">+ Nouveau projet</button>
<div style="display:flex;gap:6px"><input class="input" id="sbUrl" placeholder="Supabase URL"><input class="input" id="sbKey" placeholder="anon key"></div>
<button class="btn" style="width:100%" onclick="connect()">Connecter cloud</button>
<p style="font-size:10px;color:#666">FIX: gen ne s'annule plus si tu quittes</p><p style="font-size:10px;color:#9b7cff">✨ Scénario : Gemma 4 31B Free<br>🖼️ Images : OpenRouter + références du lore</p>
</div>
<div class="list" id="projList"></div>
</div>
<div id="overlay" onclick="closeSide()"></div>
<div class="main">
<div class="top">
<button class="btn burger" style="display:none;width:38px;padding:0" onclick="openSide()">☰</button>
<div style="font-weight:700" id="title">Aucun projet</div>
<div style="margin-left:auto;display:flex;gap:6px"><button class="btn" onclick="exportCurrent()">Export</button><button class="btn ai" onclick="openGenEp()">✨ Générer</button></div>
</div>
<div class="tabs">
<button class="tab active" onclick="go('dash',this)">Tableau</button><button class="tab" onclick="go('lore',this)">Encyclopédie</button><button class="tab" onclick="go('seasons',this)">Saisons</button><button class="tab" onclick="go('gens',this)">Génériques</button><button class="tab" onclick="go('eps',this)">Épisodes</button>
</div>
<div class="view" id="view"></div>
</div>
<div class="modal" id="mProj"><div class="box"><h3>Nouveau projet</h3><input class="input" id="pName" placeholder="Nom"><input class="input" id="pAuthor" placeholder="Auteur"><select id="pType"><option value="anime">Animé</option><option value="cartoon">Cartoon</option></select><textarea id="pSyn" placeholder="Synopsis..."></textarea><div class="row"><button class="btn" onclick="closeM('mProj')">Annuler</button><button class="btn primary" onclick="saveProj()">Créer</button></div></div></div>
<div class="modal" id="mLore"><div class="box"><h3>Fiche</h3><select id="lType"><option value="personnage">Personnage</option><option value="technique">Technique</option><option value="lieu">Lieu</option><option value="organisation">Organisation</option><option value="lore">Lore</option></select><input class="input" id="lName" placeholder="Nom"><input class="input" id="lRole" placeholder="Rôle"><input class="input" id="lImgFile" type="file" accept="image/*" onchange="previewLoreImage(this)"><img id="lImgPreviewImg" style="display:none;width:100%;max-height:220px;object-fit:contain;border-radius:12px"><textarea id="lDesc" placeholder="Description..."></textarea><div class="row"><button class="btn" onclick="closeM('mLore')">Annuler</button><button class="btn primary" onclick="saveLore()">Enregistrer</button></div></div></div>
<div class="modal" id="mSeason"><div class="box"><h3>Nouvelle saison</h3><input class="input" id="sName" placeholder="Saison 1"><input class="input" type="number" id="sCount" value="12"><textarea id="sTheme" placeholder="Arc..."></textarea><div class="row"><button class="btn" onclick="closeM('mSeason')">Annuler</button><button class="btn primary" onclick="saveSeason()">Créer</button></div></div></div>
<div class="modal" id="mGen"><div class="box"><h3 id="genH">Générique</h3><div class="row"><select id="gType"><option value="opening">Opening</option><option value="ending">Ending</option></select><select id="gSeason"></select></div><input class="input" id="gTitle" placeholder="Titre musique"><textarea id="gMusic" placeholder="Musique..."></textarea><textarea id="gVisual" placeholder="Visuel..."></textarea><label style="font-size:11px;color:#aaa">Logo opening</label><input class="input" id="gLogoFile" type="file" accept="image/*" onchange="previewGenLogo(this)"><img id="gLogoPreview" style="display:none;width:100%;max-height:140px;object-fit:contain;background:#000;border-radius:12px"><textarea id="gCredits" placeholder="Crédits"></textarea><div class="row"><button class="btn" onclick="closeM('mGen')">Annuler</button><button class="btn primary" onclick="saveGen()">Enregistrer</button></div></div></div>
<div class="modal" id="mEp"><div class="box"><h3>Générer épisode</h3><select id="eSeason"></select><input class="input" id="eTitle" placeholder="Titre"><textarea id="ePrompt" placeholder="Que se passe-t-il?"></textarea><div class="range"><span>Durée</span><input type="range" id="eDur" min="5" max="45" value="15" oninput="document.getElementById('durVal').innerText=this.value+' min'"><b id="durVal">15 min</b></div><div class="row"><button class="btn" onclick="closeM('mEp')">Annuler</button><button class="btn ai" onclick="generate()">✨ Générer</button></div><div id="genState" style="font-size:11px;color:#888"></div></div></div>
<script>
function openSide(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeSide(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function toast(t){let el=document.getElementById('toast');el.innerText=t;el.style.display='block';setTimeout(()=>el.style.display='none',2500);}
let supa=null,useCloud=false,projects=[],cur=null,curTab='dash',editLore=null,editGen=null,pendingLoreFile=null,pendingGenFile=null,pendingLoreUrl='',pendingGenUrl='';
let playerState={active:false,epId:null,intervals:[],isGenerating:false,frames:[],uniqueFps:2,fluidFps:24,genAbort:false};
const OR_TEXT_MODEL='google/gemma-4-31b-it:free';
const OR_IMAGE_MODEL='openai/gpt-image-1';
function getORKey(){return localStorage.getItem('cn-animation-openrouter-key')||'';}
function setORKey(k){localStorage.setItem('cn-animation-openrouter-key',k.trim());}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
async function ensureORKey(){let k=getORKey();if(k)return k;k=prompt('Clé API OpenRouter :');if(k){setORKey(k);return k.trim();}return ''; }
function extractDialogueCaption(text){
 let lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
 let out=[];
 for(let line of lines){
   if(/^DIALOGUE\s*:/i.test(line)) continue;
   line=line.replace(/^[-•*]\s*/,'');
   line=line.replace(/^\[[^\]]+\]\s*/,'');
   let m=line.match(/^([^:]{1,40})\s*:\s*(.+)$/);
   if(m){
     let who=m[1].trim().replace(/\s*[—-]\s*[^:]{1,50}$/,'').trim();
     let phrase=m[2].trim();
     if(phrase && !/^(action|transition|lieu|moment|role|rôle)\s*:/i.test(phrase)) out.push(`${who} : ${phrase}`);
   }
 }
 return out.join('\n');
}
async function refsForPlan(text){
 let lower=String(text||'').toLocaleLowerCase('fr-FR');
 let found=[];
 for(const l of (cur?.lore||[])){
   const name=String(l.name||'').trim();
   if(!name||!l.img) continue;
   const n=name.toLocaleLowerCase('fr-FR');
   if(lower.includes(n)){found.push(l);continue;}
   // Also match common possessive/inflected mentions by significant words.
   const words=n.split(/\s+/).filter(w=>w.length>=4);
   if(words.length && words.every(w=>lower.includes(w))) found.push(l);
 }
 let unique=[];
 for(const l of found){if(!unique.some(x=>x.id===l.id)) unique.push(l);}
 const refs=[];
 for(const l of unique.slice(0,5)){try{const u=await resolveImg(l.img);if(u) refs.push({l,url:u});}catch(e){}}
 return refs;
}
async function generateImageOpenRouter(prompt, refs, seed){
 const key=await ensureORKey(); if(!key) throw new Error('Clé OpenRouter manquante');
 let input_references=[];
 for(const r of refs){
   if(/^https?:\/\//i.test(r.url)||/^data:image\//i.test(r.url)) input_references.push({type:'image_url',image_url:{url:r.url}});
 }
 const body={model:OR_IMAGE_MODEL,prompt,quality:'high',output_format:'png',n:1};
 if(input_references.length) body.input_references=input_references;
 const res=await fetch('https://openrouter.ai/api/v1/images',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'C.N. Animation'},body:JSON.stringify(body)});
 const raw=await res.text(); let data; try{data=JSON.parse(raw)}catch(e){throw new Error('Réponse image invalide');}
 if(!res.ok) throw new Error(data?.error?.message||`Image HTTP ${res.status}`);
 const b64=data?.data?.[0]?.b64_json; if(!b64) throw new Error('Aucune image reçue');
 const mime=data?.data?.[0]?.media_type||'image/png';
 return `data:${mime};base64,${b64}`;
}

function clearPlayerTimers(){playerState.intervals.forEach(i=>clearInterval(i));playerState.intervals=[];}
function stopPlayer(){clearPlayerTimers();playerState.active=false;playerState.isGenerating=false;playerState.genAbort=true;}
const DB_NAME='cn-animation-images-v1',DB_STORE='images';
function openImageDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE)) r.result.createObjectStore(DB_STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function saveImageLocal(dataUrl){const db=await openImageDB();const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);await new Promise((a,b)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(dataUrl,id);tx.oncomplete=a;tx.onerror=()=>b(tx.error);});return 'idb:'+id;}
async function getImageLocal(key){if(!key) return ''; if(!key.startsWith('idb:')) return key; try{const db=await openImageDB();return await new Promise((a,b)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(key.slice(4));req.onsuccess=()=>a(req.result||'');req.onerror=()=>b(req.error);});}catch(e){return '';} }
async function uploadToSupabase(file){if(!supa) return ''; const name=Date.now()+'_'+file.name; const {error}=await supa.storage.from('images').upload(name,file,{upsert:true}); if(error){alert('Upload: '+error.message);return '';} const {data:pub}=supa.storage.from('images').getPublicUrl(name); return pub.publicUrl;}
function loadProjects(){try{projects=JSON.parse(localStorage.getItem('cn-animation-v2')||'[]');if(!Array.isArray(projects)) projects=[];}catch(e){projects=[];}cur=projects[0]||null;}
function persist(){try{localStorage.setItem('cn-animation-v2',JSON.stringify(projects));if(useCloud&&supa) saveCloud();renderList();if(!playerState.active) render();}catch(e){alert('Stockage plein');}}
async function resolveImg(key){ if(!key) return ''; if(key.startsWith('http')) return key; if(key.startsWith('idb:')) return await getImageLocal(key); return key; }
async function hydrateImgs(){ document.querySelectorAll('[data-img]').forEach(async el=>{let k=el.getAttribute('data-img');let s=await resolveImg(k); if(s) el.src=s;});}
async function connect(){let u=document.getElementById('sbUrl').value.trim(),k=document.getElementById('sbKey').value.trim();if(!u||!k) return alert('URL + key');supa=supabase.createClient(u,k);useCloud=true;document.getElementById('sync').innerText='CLOUD';try{let {data}=await supa.from('cn_projects').select('*');if(data&&data.length&&data[0].data){projects=data[0].data;cur=projects[0];localStorage.setItem('cn-animation-v2',JSON.stringify(projects));}else{await saveCloud();}}catch(e){}renderList();render();}
async function saveCloud(){if(!supa) return; try{await supa.from('cn_projects').upsert({id:1,data:projects});}catch(e){}}
function openNew(){document.getElementById('mProj').classList.add('open');}
function closeM(id){document.getElementById(id).classList.remove('open');}
function saveProj(){let n=document.getElementById('pName').value.trim();if(!n) return alert('Nom');if(projects.length>=5) return alert('5 max');let p={id:Date.now(),name:n,author:document.getElementById('pAuthor').value||'Anonyme',type:document.getElementById('pType').value,synopsis:document.getElementById('pSyn').value,lore:[],saisons:[],generiques:[],episodes:[]};projects.push(p);cur=p;closeM('mProj');persist();closeSide();}
function renderList(){let el=document.getElementById('projList');el.innerHTML='';projects.forEach(p=>{let d=document.createElement('div');d.className='proj'+(cur&&cur.id===p.id?' active':'');d.innerHTML=`<b style="font-size:13px">${p.name}</b><small style="display:block;color:#888">${p.episodes.length}/200</small>`;d.onclick=()=>{cur=p;renderList();render();closeSide();};el.appendChild(d);});document.getElementById('title').innerText=cur?cur.name:'Aucun projet';}
function go(t,el){if(playerState.isGenerating){if(!confirm('Génération en cours ('+playerState.frames.filter(Boolean).length+'/'+playerState.frames.length+'). Continuer en fond?')) return;toast('Génération continue en fond');}if(playerState.active &&!playerState.isGenerating) stopPlayer();curTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el) el.classList.add('active');render();}
function render(){let v=document.getElementById('view'); if(!cur){v.innerHTML=`<div style="flex:1;display:flex;align-items:center;justify-content:center"><button class="btn primary" onclick="openNew()">+ Créer projet</button></div>`;return;}if(playerState.active) return;if(curTab==='dash') v.innerHTML=`<div class="card"><h3>${cur.name}</h3><p style="font-size:12px;color:#888">${cur.synopsis||''}</p>${playerState.isGenerating?`<div style="margin-top:10px;background:#6d28ff;padding:10px;border-radius:12px;font-size:11px">⚡ Génération en cours: ${playerState.frames.filter(Boolean).length}/${playerState.frames.length} • <button class="btn primary" style="height:28px;margin-left:8px" onclick="resumePlayer()">Revenir au player</button></div>`:''}</div>`;if(curTab==='lore'){v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Encyclopédie</h3><button class="btn primary" onclick="openLore()">+ Fiche</button></div><div class="grid" style="margin-top:12px">${cur.lore.map((l,i)=>`<div class="card" onclick="openLore(${i})"><img data-img="${l.img||''}" src="https://via.placeholder.com/300x400"><span class="badge">${l.type}</span><b>${l.name}</b></div>`).join('')||'Aucune'}</div>`;hydrateImgs();}if(curTab==='seasons') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Saisons</h3><button class="btn primary" onclick="document.getElementById('mSeason').classList.add('open')">+ Saison</button></div><div class="grid" style="margin-top:12px">${cur.saisons.map(s=>`<div class="card"><b>${s.name}</b><span class="badge">${cur.generiques.filter(g=>g.saisonId===s.id).length}/2</span><button class="btn" onclick="openGenM('${s.id}')">+ Générique</button></div>`).join('')||'Pas de saison'}</div>`;if(curTab==='gens'){v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Génériques</h3><button class="btn primary" onclick="openGenM()">+ Générique</button></div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${cur.generiques.map((g,i)=>{let s=cur.saisons.find(x=>x.id===g.saisonId);return `<div class="card" style="flex-direction:row;align-items:center;gap:12px" onclick="openGenM(null,${i})"><img data-img="${g.logo||''}" style="width:100px;height:60px;object-fit:contain;background:#000"><div style="flex:1"><b>${g.type.toUpperCase()} - ${s?s.name:''} - ${g.title}</b></div><button class="btn" onclick="event.stopPropagation();delGen(${i})">×</button></div>`}).join('')||'Aucun'}</div>`;hydrateImgs();}if(curTab==='eps') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Épisodes ${cur.episodes.length}/200</h3><button class="btn ai" onclick="openGenEp()">✨ Générer</button></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${cur.episodes.map((ep,i)=>`<div class="card" style="flex-direction:row;align-items:center"><div style="width:52px;height:52px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">${ep.duration}'</div><div style="flex:1"><b>${ep.title}</b><p style="font-size:11px;color:#777">${ep.prompt.slice(0,60)}</p>${ep.framesPrebuilt?'<span class="badge" style="background:#0a3;color:#fff">SAVED '+ep.framesPrebuilt.length+' • '+ep.preFps+'/sec • '+(ep.preFluid||24)+'fps</span>':'<span class="badge">Nouveau</span>'}${playerState.epId===ep.id && playerState.isGenerating?`<span class="badge" style="background:#6d28ff;color:#fff;margin-left:6px">GÉNÈRE ${playerState.frames.filter(Boolean).length}/${playerState.frames.length}</span>`:''}</div><button class="btn primary" onclick="playEp(${i})">${playerState.epId===ep.id && playerState.active?'↻ Reprendre':'▶ Lire'}</button></div>`).join('')||'Aucun'}</div>`;}
function openLore(i=null){editLore=i;const img=document.getElementById('lImgPreviewImg');img.style.display='none';if(i!==null){let l=cur.lore[i];document.getElementById('lType').value=l.type;document.getElementById('lName').value=l.name;document.getElementById('lRole').value=l.role||'';document.getElementById('lDesc').value=l.desc||''; if(l.img){resolveImg(l.img).then(s=>{img.src=s;img.style.display='block';});}}else{document.getElementById('lType').value='personnage';document.getElementById('lName').value='';document.getElementById('lRole').value='';document.getElementById('lDesc').value='';}document.getElementById('mLore').classList.add('open');}
function previewLoreImage(input){let f=input.files[0];if(!f) return; pendingLoreFile=f; let r=new FileReader(); r.onload=()=>{document.getElementById('lImgPreviewImg').src=r.result;document.getElementById('lImgPreviewImg').style.display='block';pendingLoreUrl=r.result;}; r.readAsDataURL(f);}
async function saveLore(){let n=document.getElementById('lName').value.trim();if(!n) return alert('Nom');let old=editLore!==null?cur.lore[editLore]:null; let imgKey=old?old.img:''; if(pendingLoreFile){ if(useCloud) imgKey=await uploadToSupabase(pendingLoreFile); else imgKey=await saveImageLocal(pendingLoreUrl);} let e={id:old?old.id:Date.now(),type:document.getElementById('lType').value,name:n,role:document.getElementById('lRole').value,img:imgKey,desc:document.getElementById('lDesc').value}; if(editLore!==null) cur.lore[editLore]=e; else cur.lore.push(e); closeM('mLore'); persist();}
function saveSeason(){let n=document.getElementById('sName').value.trim();if(!n) return alert('Nom'); cur.saisons.push({id:'s'+Date.now(),name:n,count:parseInt(document.getElementById('sCount').value)||12,theme:document.getElementById('sTheme').value}); closeM('mSeason'); persist();}
function previewGenLogo(input){let f=input.files[0]; if(!f) return; pendingGenFile=f; let r=new FileReader(); r.onload=()=>{document.getElementById('gLogoPreview').src=r.result;document.getElementById('gLogoPreview').style.display='block';pendingGenUrl=r.result;}; r.readAsDataURL(f);}
async function openGenM(pre=null,editIdx=null){let s=document.getElementById('gSeason'); s.innerHTML=cur.saisons.map(x=>`<option value="${x.id}" ${x.id===pre?'selected':''}>${x.name}</option>`).join(''); if(editIdx!==null){editGen=editIdx; let g=cur.generiques[editIdx]; document.getElementById('genH').innerText='Modifier'; document.getElementById('gType').value=g.type; s.value=g.saisonId; document.getElementById('gTitle').value=g.title; document.getElementById('gMusic').value=g.music; document.getElementById('gVisual').value=g.visual; document.getElementById('gCredits').value=g.credits; if(g.logo){let src=await resolveImg(g.logo); document.getElementById('gLogoPreview').src=src; document.getElementById('gLogoPreview').style.display='block';}} else {editGen=null; document.getElementById('genH').innerText='Nouveau'; document.getElementById('gTitle').value='';document.getElementById('gMusic').value='';document.getElementById('gVisual').value='';document.getElementById('gCredits').value='';document.getElementById('gLogoPreview').style.display='none';} document.getElementById('mGen').classList.add('open');}
async function saveGen(){let sid=document.getElementById('gSeason').value; if(!sid) return alert('Saison'); let type=document.getElementById('gType').value; let exists=cur.generiques.find(g=>g.saisonId===sid && g.type===type && cur.generiques.indexOf(g)!==editGen); if(exists) return alert(type+' existe déjà (1 max)'); let logoKey=editGen!==null?cur.generiques[editGen].logo||'':''; if(pendingGenFile){ if(useCloud) logoKey=await uploadToSupabase(pendingGenFile); else logoKey=await saveImageLocal(pendingGenUrl); } let obj={id:editGen!==null?cur.generiques[editGen].id:'g'+Date.now(),saisonId:sid,type, title:document.getElementById('gTitle').value,music:document.getElementById('gMusic').value,visual:document.getElementById('gVisual').value,credits:document.getElementById('gCredits').value,logo:logoKey}; if(editGen!==null) cur.generiques[editGen]=obj; else cur.generiques.push(obj); closeM('mGen'); persist();}
function delGen(i){if(confirm('Supprimer?')){cur.generiques.splice(i,1); persist();}}
function openGenEp(){if(!cur.saisons.length) return alert('Saison');let sel=document.getElementById('eSeason');sel.innerHTML=cur.saisons.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');document.getElementById('mEp').classList.add('open');}
async function generate(){
 if(cur.episodes.length>=200) return alert('200 max');
 let sid=document.getElementById('eSeason').value,title=document.getElementById('eTitle').value.trim()||`Épisode ${cur.episodes.length+1}`,prompt=document.getElementById('ePrompt').value.trim(),dur=parseInt(document.getElementById('eDur').value)||15;
 if(!prompt) return alert('Prompt');
 let key=await ensureORKey(); if(!key) return;
 let state=document.getElementById('genState');state.innerText='Génération avec Gemma 4 31B...';
 let lore=cur.lore.map(l=>`[${l.type}] ${l.name}${l.role?` — rôle: ${l.role}`:''}: ${l.desc||''}${l.img?' [IMAGE DE RÉFÉRENCE DISPONIBLE]':''}`).join('\n').slice(0,12000);
 let saison=cur.saisons.find(s=>s.id===sid);
 let full=`Tu es le showrunner de C.N. Animation. Écris un épisode complet en français, visuel, naturel et cohérent.
CANON: ${cur.name}. Synopsis: ${cur.synopsis||'aucun'}.
SAISON: ${saison?.name||'inconnue'} — ${saison?.theme||''}.
LORE:
${lore||'aucun'}
ÉPISODE: ${title}, ${dur} minutes.
DEMANDE DU CRÉATEUR: ${prompt}

RÈGLES: respecte le canon; ne change jamais l'apparence, le rôle, les pouvoirs ou les relations établis; chaque scène fait avancer l'histoire; dialogues naturels et différents; pas de remplissage; vrais enjeux; début, développement, résolution ou cliffhanger.
FORMAT STRICT:
[01 - LIEU - MOMENT]
ACTION: description visuelle précise.
DIALOGUE:
NomDuPersonnage: phrase
NomDuPersonnage: phrase
TRANSITION: ...

IMPORTANT SOUS-TITRES: une réplique doit toujours être exactement « NOM : PHRASE ». N'écris JAMAIS le rôle, la fonction ou une description du personnage entre le nom et la phrase. Le champ RÔLE de l'encyclopédie sert uniquement au contexte interne.
Produis au moins ${Math.max(15,dur*3)} scènes/plans utiles.`;
 try{
  let r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'HTTP-Referer':location.href,'X-Title':'C.N. Animation'},body:JSON.stringify({model:OR_TEXT_MODEL,messages:[{role:'system',content:'Tu es un scénariste expert en animation et showrunner. Tu privilégies la continuité, les personnages crédibles, les dialogues naturels et la mise en scène visuelle. Le canon fourni est prioritaire.'},{role:'user',content:full}],temperature:.82,max_tokens:32768})});
  let raw=await r.text(),d;try{d=JSON.parse(raw)}catch(e){throw new Error('Réponse OpenRouter invalide')}
  if(!r.ok) throw new Error(d?.error?.message||`HTTP ${r.status}`);
  let txt=d?.choices?.[0]?.message?.content;if(!txt)throw new Error('Aucun scénario reçu');
  cur.episodes.push({id:'ep'+Date.now(),saisonId:sid,title,prompt,duration:dur,generated:txt,createdAt:new Date().toISOString(),framesPrebuilt:null,preFps:2,preFluid:24});
  state.innerText='Prêt';setTimeout(()=>{closeM('mEp');persist();go('eps');},400);
 }catch(e){state.innerText='Erreur : '+e.message;console.error(e);}
}
function resumePlayer(){ if(!playerState.epId) return; let idx=cur.episodes.findIndex(e=>e.id===playerState.epId); if(idx>=0) playEp(idx); }
async function playEp(idx){let ep=cur.episodes[idx];if(playerState.active && playerState.epId===ep.id){ renderPlayerUI(ep); return; }stopPlayer();playerState.active=true; playerState.epId=ep.id; playerState.uniqueFps=ep.preFps||2; playerState.fluidFps=ep.preFluid||24; playerState.genAbort=false;renderPlayerUI(ep);startGenerationAndPlay(ep);}
function renderPlayerUI(ep){let v=document.getElementById('view');v.innerHTML=`<div class="player"><div class="screen" id="scr"><img id="fA" class="frame" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><img id="fB" class="frame" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0"><div style="position:absolute;inset:0;background:linear-gradient(transparent 30%, rgba(0,0,0,.9));z-index:2"></div><div id="capt" style="position:absolute;bottom:0;left:0;right:0;z-index:3;padding:12px;font-size:12px;white-space:pre-wrap"></div><img id="logoShow" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:68%;max-height:42%;z-index:5;display:none"><div id="counter" style="position:absolute;top:10px;left:10px;z-index:4;font-size:10px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:20px"></div><div id="pre" style="position:absolute;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><h2 style="font-family:Bebas Neue;font-size:28px">Chargement 8x...</h2><div style="width:70%;height:6px;background:#222;border-radius:10px;overflow:hidden"><div id="preBar" style="height:100%;background:#fff;width:0%"></div></div><div id="preCount" style="font-size:11px;color:#888"></div><button class="btn" style="margin-top:8px" onclick="stopPlayer();render();">Quitter (garde en fond)</button></div></div><div style="padding:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="btn" onclick="stopPlayer();render();">← Retour</button><div style="display:flex;gap:4px"><button class="btn" onclick="setUnique(1)" id="b1">1/sec</button><button class="btn" onclick="setUnique(2)" id="b2">2/sec</button><button class="btn" onclick="setUnique(3)" id="b3">3/sec</button></div><div style="display:flex;gap:4px;margin-left:6px"><button class="btn" onclick="setFluid(12)" id="f12">12 fps</button><button class="btn" onclick="setFluid(24)" id="f24">24 fps</button></div><button class="btn primary" id="playBtn" style="margin-left:auto">⏸</button></div></div>`;updateFpsButtons();}
function updateFpsButtons(){let b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3'),f12=document.getElementById('f12'),f24=document.getElementById('f24');if(!b1) return;[b1,b2,b3].forEach(b=>b.classList.remove('primary'));let ub=document.getElementById('b'+playerState.uniqueFps); if(ub) ub.classList.add('primary');[f12,f24].forEach(b=>b.classList.remove('primary'));let fb=document.getElementById('f'+playerState.fluidFps); if(fb) fb.classList.add('primary');}
window.setUnique=(n)=>{if(playerState.uniqueFps===n) return;if(playerState.isGenerating &&!confirm('Changer de '+playerState.uniqueFps+'/sec à '+n+'/sec va relancer la génération. Continuer?')) return;playerState.uniqueFps=n;let ep=cur.episodes.find(e=>e.id===playerState.epId);if(ep){ ep.preFps=n; persist(); }updateFpsButtons();if(playerState.isGenerating) { playerState.genAbort=true; setTimeout(()=>{ if(cur) startGenerationAndPlay(ep,true); },200); }else { startGenerationAndPlay(ep,true); }};
window.setFluid=(n)=>{playerState.fluidFps=n;let ep=cur.episodes.find(e=>e.id===playerState.epId);if(ep){ ep.preFluid=n; persist(); }updateFpsButtons();};
async function startGenerationAndPlay(ep, force=false){
 let op=cur.generiques.find(g=>g.saisonId===ep.saisonId&&g.type==='opening');
 let plans=[];
 if(op){plans.push(`[OPENING ${op.title}] ${op.visual}`); (op.credits||'').split('\n').filter(l=>l.trim()).forEach(c=>plans.push(`[CREDIT] ${c}`));}
 plans=plans.concat(ep.generated.split(/\n(?=\[?\d+\s*[-–])/).map(x=>x.trim()).filter(x=>x.length>8));
 if(plans.length<2) plans=ep.generated.split('\n').filter(l=>l.trim().length>8);
 let totalUnique=Math.max(1,ep.duration*60*playerState.uniqueFps);
 let logoSrc=op&&op.logo?await resolveImg(op.logo):'';
 if(!force && ep.framesPrebuilt && ep.framesPrebuilt.length===totalUnique && ep.preFps===playerState.uniqueFps){playerState.frames=ep.framesPrebuilt;playerState.isGenerating=false;let pre=document.getElementById('pre');if(pre)pre.style.display='none';playFrames(playerState.frames,ep,logoSrc);return;}
 playerState.isGenerating=true;playerState.genAbort=false;playerState.frames=new Array(totalUnique);
 while(plans.length<totalUnique) plans.push(plans[(plans.length-1)%Math.max(1,plans.length)]);
 let usePlans=plans.slice(0,totalUnique),done=0,CONCURRENT=2;
 async function loadOne(k){
  if(playerState.genAbort)return;
  const raw=usePlans[k];
  const refs=await refsForPlan(raw);
  const refContext=refs.length?`\nRÉFÉRENCES VISUELLES FOURNIES : ${refs.map(r=>r.l.name).join(', ')}. Conserve fidèlement leur apparence visible dans les références. Ne les remplace pas par un autre design.`:'';
  const clean=raw.replace(/^\[[^\]]+\]\s*/,'').replace(/\b(DIALOGUE|TRANSITION|ACTION)\s*:/gi,'');
  const imagePrompt=`Anime cinematic storyboard frame, 16:9. Create ONE polished animation keyframe for this exact scene. ${clean}${refContext}\nSTYLE: coherent 2D/illustrated anime, clean line art, detailed but readable composition, expressive faces, correct anatomy, consistent clothing and colors, cinematic lighting, strong depth, appropriate camera angle, no text, no subtitles, no watermark. The scene must visually match the described action and location. Do not invent unrelated characters or objects. If reference images are supplied, they are authoritative for the appearance of those named elements.`;
  try{
   const url=await generateImageOpenRouter(imagePrompt,refs,1000+k);
   if(playerState.genAbort)return;
   playerState.frames[k]={text:extractDialogueCaption(raw)||raw,url};
  }catch(e){
   console.error('Image generation',k,e);
   // Keep the scene alive with a clear fallback rather than crashing the whole episode.
   playerState.frames[k]={text:extractDialogueCaption(raw)||raw,url:''};
  }
  done++;let bar=document.getElementById('preBar'),cnt=document.getElementById('preCount');if(bar)bar.style.width=(done/totalUnique*100)+'%';if(cnt)cnt.innerText=`${done}/${totalUnique} • références visuelles automatiques • Gemma + image`;
  if(done%2===0){ep.framesPrebuilt=[...playerState.frames];ep.preFps=playerState.uniqueFps;ep.preFluid=playerState.fluidFps;try{localStorage.setItem('cn-animation-v2',JSON.stringify(projects));}catch(e){}}
 }
 for(let i=0;i<totalUnique;i+=CONCURRENT){if(playerState.genAbort)break;let batch=[];for(let j=0;j<CONCURRENT&&i+j<totalUnique;j++)batch.push(loadOne(i+j));await Promise.all(batch);}
 if(playerState.genAbort){toast('Génération arrêtée');return;}
 ep.framesPrebuilt=[...playerState.frames];ep.preFps=playerState.uniqueFps;ep.preFluid=playerState.fluidFps;persist();playerState.isGenerating=false;let pre=document.getElementById('pre');if(pre)pre.style.display='none';playFrames(playerState.frames,ep,logoSrc);
}
function playFrames(frames, ep, logoSrc){
 clearPlayerTimers();let fA=document.getElementById('fA'), fB=document.getElementById('fB');if(!fA) return;let curImg=fA, nextImg=fB; let idxFrame=0, playing=true;
 function showUnique(k){if(k>=frames.length){ let c=document.getElementById('capt'); if(c) c.innerText='FIN — '+ep.title; playing=false; return; }if(!frames[k]) return;let capt=document.getElementById('capt'); if(capt) capt.innerText=extractDialogueCaption(frames[k].text)||frames[k].text;let counter=document.getElementById('counter'); if(counter) counter.innerText=`${k}/${frames.length} • SAVED • ${playerState.uniqueFps}/sec • ${playerState.fluidFps}fps`;if(nextImg){ nextImg.style.opacity=0; nextImg.src=frames[k].url; nextImg.onload=()=>{nextImg.style.opacity=1; curImg.style.opacity=0; let t=curImg; curImg=nextImg; nextImg=t;}; }if(k===2 && logoSrc){ let l=document.getElementById('logoShow'); if(l){ l.src=logoSrc; l.style.display='block'; setTimeout(()=>{if(l) l.style.display='none'},3000); } }}
 showUnique(0);
 let it1=setInterval(()=>{ if(!playing) return; idxFrame++; if(idxFrame<frames.length) showUnique(idxFrame); }, 1000/playerState.uniqueFps);
 let it2=setInterval(()=>{ if(!playing) return; let s=1.15+Math.sin(Date.now()/600)*0.05; if(curImg) curImg.style.transform=`scale(${s}) translate(${Math.sin(Date.now()/400)*4}px, ${Math.cos(Date.now()/500)*3}px)`; }, 1000/playerState.fluidFps);
 playerState.intervals=[it1,it2];
 let playBtn=document.getElementById('playBtn'); if(playBtn) playBtn.onclick=()=>{playing=!playing; playBtn.innerText=playing?'⏸':'▶';};
}
function exportCurrent(){if(!cur) return;let b=new Blob([JSON.stringify(cur,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cur.name.replace(/\s+/g,'_')+'.json';a.click();}
loadProjects();renderList();render();
</script>
