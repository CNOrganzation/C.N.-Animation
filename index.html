<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.N. Animation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#050507;color:#fff;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:280px;background:#0b0b0f;border-right:1px solid #1f1f28;display:flex;flex-direction:column;flex:none;z-index:30;transition:.25s}
.logo{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #1f1f28;font-weight:900}
.logo i{width:28px;height:28px;background:#fff;color:#000;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.list{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.proj{padding:12px;border-radius:14px;background:#13131a;border:1px solid #1f1f28;cursor:pointer}
.proj.active{background:#fff;color:#000}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#08080c}
.top{height:56px;border-bottom:1px solid #1f1f28;display:flex;align-items:center;padding:0 14px;gap:8px;background:#0b0b0f;flex:none}
.btn{height:38px;padding:0 16px;border-radius:12px;border:1px solid #252530;background:#191922;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.ai{background:#6d28ff;border-color:#6d28ff}
.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #1f1f28;overflow:auto;flex:none}
.tab{height:32px;padding:0 14px;border-radius:20px;border:1px solid #252530;background:#13131a;color:#777;font-size:11px;font-weight:700;white-space:nowrap}
.tab.active{background:#fff;color:#000}
.view{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#13131a;border:1px solid #1f1f28;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#0a0a0a}
.input,textarea,select{width:100%;background:#11111a;border:1px solid #252530;border-radius:12px;padding:11px;color:#fff;font-size:13px;outline:none}
.badge{font-size:9px;padding:4px 7px;border-radius:6px;background:#1d1d28;color:#aaa;font-weight:700;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.box{width:100%;max-width:600px;background:#12121a;border:1px solid #252530;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.range{display:flex;align-items:center;gap:12px;background:#11111a;border:1px solid #252530;border-radius:12px;padding:10px 12px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 20px}
.player{background:#000;border:1px solid #1f1f28;border-radius:18px;overflow:hidden;max-width:960px;margin:auto;width:100%}
.screen{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;position:relative}
.screen h1{font-family:'Bebas Neue';font-size:64px}
@media(max-width:860px){
.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
.burger{display:flex!important}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<div class="logo"><i>CN</i> ANIMATION <span style="margin-left:auto;font-size:10px;color:#666" id="sync">LOCAL</span></div>
<div style="padding:12px;display:flex;flex-direction:column;gap:8px">
<button class="btn primary" style="width:100%;height:44px" onclick="openNew()">+ Nouveau projet</button>
<div style="display:flex;gap:6px"><input class="input" id="sbUrl" placeholder="Supabase URL"><input class="input" id="sbKey" placeholder="anon key"></div>
<button class="btn" style="width:100%" onclick="connect()">Connecter cloud</button>
<p style="font-size:10px;color:#666">5 projets max • 200 épisodes</p>
</div>
<div class="list" id="projList"></div>
</div>

<div class="main">
<div class="top">
<button class="btn burger" style="display:none;width:38px;padding:0" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div style="font-weight:700" id="title">Aucun projet</div>
<div style="margin-left:auto;display:flex;gap:6px">
<button class="btn" onclick="exportCurrent()">Export</button>
<button class="btn ai" onclick="openGenEp()">✨ Générer épisode</button>
</div>
</div>
<div class="tabs">
<button class="tab active" onclick="go('dash',this)">Tableau</button>
<button class="tab" onclick="go('lore',this)">Encyclopédie</button>
<button class="tab" onclick="go('seasons',this)">Saisons</button>
<button class="tab" onclick="go('gens',this)">Génériques</button>
<button class="tab" onclick="go('eps',this)">Épisodes</button>
</div>
<div class="view" id="view"></div>
</div>

<!-- MODALS -->
<div class="modal" id="mProj"><div class="box"><h3>Nouveau projet</h3><input class="input" id="pName" placeholder="Nom — ex: KATANA Eclipse Noir"><input class="input" id="pAuthor" placeholder="Auteur — ton nom"><select id="pType"><option value="anime">Animé</option><option value="cartoon">Cartoon</option></select><textarea id="pSyn" placeholder="Synopsis, univers, ton..."></textarea><div class="row"><button class="btn" onclick="closeM('mProj')">Annuler</button><button class="btn primary" onclick="saveProj()">Créer projet</button></div></div></div>
<div class="modal" id="mLore"><div class="box"><h3>Fiche encyclopédie</h3><select id="lType"><option value="personnage">Personnage</option><option value="technique">Technique</option><option value="lieu">Lieu</option><option value="organisation">Organisation</option><option value="lore">Lore</option></select><input class="input" id="lName" placeholder="Nom"><input class="input" id="lRole" placeholder="Rôle — Protagoniste, Katana maudit...">
<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:11px;color:#aaa">Image du personnage / élément</label>
<input class="input" id="lImgFile" type="file" accept="image/*" onchange="previewLoreImage(this)">
<div id="lImgPreview" style="display:none;position:relative">
<img id="lImgPreviewImg" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#0a0a0a;border:1px solid #252530">
<button type="button" class="btn" style="position:absolute;right:8px;top:8px" onclick="clearLoreImage()">✕</button>
</div>
<p style="font-size:10px;color:#666">Importe une image depuis ton téléphone ou ton PC. Elle sera enregistrée dans le projet.</p>
</div>
<textarea id="lDesc" placeholder="Description complète que l'IA va utiliser..."></textarea><div class="row"><button class="btn" onclick="closeM('mLore')">Annuler</button><button class="btn primary" onclick="saveLore()">Enregistrer</button></div></div></div>
<div class="modal" id="mSeason"><div class="box"><h3>Nouvelle saison</h3><input class="input" id="sName" placeholder="Saison 1 — L'Éveil"><input class="input" type="number" id="sCount" value="12"><textarea id="sTheme" placeholder="Arc narratif..."></textarea><div class="row"><button class="btn" onclick="closeM('mSeason')">Annuler</button><button class="btn primary" onclick="saveSeason()">Créer</button></div></div></div>
<div class="modal" id="mGen"><div class="box"><h3>Générique</h3><div class="row"><select id="gType"><option value="opening">Opening</option><option value="ending">Ending</option></select><select id="gSeason"></select></div><input class="input" id="gTitle" placeholder="Titre musique"><textarea id="gMusic" placeholder="Musique — style, BPM, instruments..."></textarea><textarea id="gVisual" placeholder="Visuel — description..."></textarea><textarea id="gCredits" placeholder="Crédits — un par ligne"></textarea><div class="row"><button class="btn" onclick="closeM('mGen')">Annuler</button><button class="btn primary" onclick="saveGen()">Enregistrer</button></div></div></div>
<div class="modal" id="mEp"><div class="box" style="max-width:700px"><h3>Générer épisode</h3><select id="eSeason"></select><input class="input" id="eTitle" placeholder="Titre épisode"><textarea id="ePrompt" placeholder="Que se passe-t-il? Conflit, évolution..."></textarea><div class="range"><span style="font-size:11px">Durée</span><input type="range" id="eDur" min="15" max="45" value="20" oninput="document.getElementById('durVal').innerText=this.value+' min'"><b id="durVal">20 min</b></div><div class="row"><button class="btn" onclick="closeM('mEp')">Annuler</button><button class="btn ai" onclick="generate()">✨ Générer</button></div><div id="genState" style="font-size:11px;color:#888"></div></div></div>

<script>
let supa=null, useCloud=false;
let projects=[];
let cur=null, curTab='dash', editLore=null;
let pendingLoreImage='';
const DB_NAME='cn-animation-images-v1';
const DB_STORE='images';

function openImageDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE); };
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function saveImage(dataUrl){
 const db=await openImageDB();
 const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(DB_STORE,'readwrite');
  tx.objectStore(DB_STORE).put(dataUrl,id);
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 });
 return 'idb:'+id;
}
async function getImage(key){
 if(!key) return '';
 if(!key.startsWith('idb:')) return key;
 try{
  const db=await openImageDB();
  return await new Promise((resolve,reject)=>{
   const tx=db.transaction(DB_STORE,'readonly');
   const req=tx.objectStore(DB_STORE).get(key.slice(4));
   req.onsuccess=()=>resolve(req.result||'');
   req.onerror=()=>reject(req.error);
  });
 }catch(e){return '';}
}
async function deleteImage(key){
 if(!key||!key.startsWith('idb:')) return;
 try{
  const db=await openImageDB();
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(DB_STORE,'readwrite');
   tx.objectStore(DB_STORE).delete(key.slice(4));
   tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
 }catch(e){}
}
async function migrateImages(){
 let changed=false;
 for(const p of projects){
  for(const l of (p.lore||[])){
   if(l.img && l.img.startsWith('data:image/')){
    l.img=await saveImage(l.img);
    changed=true;
   }
  }
 }
 if(changed) safePersist();
}
function loadProjects(){
 try{
  projects=JSON.parse(localStorage.getItem('cn-animation-v2')||'[]');
  if(!Array.isArray(projects)) projects=[];
 }catch(e){ projects=[]; }
 cur=projects[0]||null;
 migrateImages();
}
function safePersist(){
 try{
  localStorage.setItem('cn-animation-v2',JSON.stringify(projects));
  if(useCloud&&supa) saveCloud();
  renderList(); render();
  return true;
 }catch(e){
  console.error(e);
  alert('Impossible d’enregistrer localement. Le stockage du navigateur est plein.');
  return false;
 }
}
function persist(){ return safePersist(); }

async function hydrateLoreImages(){
 if(curTab!=='lore') return;
 document.querySelectorAll('[data-lore-img]').forEach(async el=>{
  const key=el.getAttribute('data-lore-img');
  const src=await getImage(key);
  if(src) el.src=src;
 });
}
async function connect(){ let u=document.getElementById('sbUrl').value.trim(), k=document.getElementById('sbKey').value.trim(); if(!u||!k) return alert('URL + key'); supa=supabase.createClient(u,k); useCloud=true; document.getElementById('sync').innerText='CLOUD'; try{let {data}=await supa.from('cn_projects').select('*'); if(data&&data.length&&data[0].data){projects=data[0].data; cur=projects[0]; localStorage.setItem('cn-animation-v2',JSON.stringify(projects));} else {await saveCloud();}}catch(e){} renderList(); render(); }
async function saveCloud(){ if(!supa) return; try{await supa.from('cn_projects').upsert({id:1,data:projects});}catch(e){} }

function openNew(){ document.getElementById('mProj').classList.add('open'); }
function closeM(id){ document.getElementById(id).classList.remove('open'); }
function saveProj(){
 let n=document.getElementById('pName').value.trim(); if(!n) return alert('Nom requis');
 if(projects.length>=5) return alert('5 max');
 let p={id:Date.now(), name:n, author:document.getElementById('pAuthor').value||'Anonyme', type:document.getElementById('pType').value, synopsis:document.getElementById('pSyn').value, lore:[], saisons:[], generiques:[], episodes:[]};
 projects.push(p); cur=p; closeM('mProj'); persist(); document.getElementById('sidebar').classList.remove('open');
}
function renderList(){
 let el=document.getElementById('projList'); el.innerHTML='';
 projects.forEach(p=>{
  let d=document.createElement('div'); d.className='proj'+(cur&&cur.id===p.id?' active':'');
  d.innerHTML=`<b style="font-size:13px">${p.name}</b><small style="display:block;margin-top:2px;color:#888">${p.type} • ${p.episodes.length}/200</small>`;
  d.onclick=()=>{cur=p; document.getElementById('sidebar').classList.remove('open'); renderList(); render();};
  el.appendChild(d);
 });
 document.getElementById('title').innerText=cur?cur.name:'Aucun projet';
}
function go(t,el){ curTab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); if(el) el.classList.add('active'); render(); }
function render(){
 let v=document.getElementById('view'); if(!cur){
  v.innerHTML=`<div class="empty"><div style="width:64px;height:64px;background:#fff;color:#000;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900">CN</div><h3>Aucun projet</h3><p style="font-size:12px;color:#777;max-width:280px">Crée ton premier anime / cartoon. 5 projets max, 200 épisodes chacun.</p><button class="btn primary" style="height:48px;padding:0 24px" onclick="openNew()">+ Créer un projet</button></div>`;
  return;
 }
 if(curTab==='dash') v.innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card" style="grid-column:span 2"><h3>${cur.name}</h3><p style="font-size:12px;color:#888;margin-top:6px">${cur.synopsis||'Pas de synopsis'}</p><div style="display:flex;gap:6px;margin-top:10px"><span class="badge">${cur.type}</span><span class="badge">${cur.lore.length} fiches</span><span class="badge">${cur.saisons.length} saisons</span><span class="badge">${cur.episodes.length}/200</span></div></div><div class="card"><h4>Encyclopédie</h4><p style="font-size:11px;color:#777">Personnages, pouvoirs, lieux</p><button class="btn primary" style="margin-top:8px" onclick="go('lore',document.querySelectorAll('.tab')[1])">Ouvrir</button></div><div class="card"><h4>Génériques</h4><p style="font-size:11px;color:#777">Opening / Ending</p><button class="btn primary" style="margin-top:8px" onclick="go('gens',document.querySelectorAll('.tab')[3])">Gérer</button></div></div>`;
 if(curTab==='lore') {
 v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Encyclopédie</h3><button class="btn primary" onclick="openLore()">+ Fiche</button></div><div class="grid" style="margin-top:12px">${cur.lore.map((l,i)=>`<div class="card" onclick="openLore(${i})"><img data-lore-img="${l.img||''}" src="${l.img&&l.img.startsWith('data:image/')?l.img:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#13131a"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#777" font-family="Arial" font-size="18">${l.name}</text></svg>`)}"><span class="badge">${l.type} • ${l.role||''}</span><b style="font-size:12px">${l.name}</b><p style="font-size:10px;color:#777">${(l.desc||'').slice(0,100)}...</p></div>`).join('')||'<p style="opacity:.4">Aucune fiche</p>'}</div>`;
 hydrateLoreImages();
}
 if(curTab==='seasons') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Saisons</h3><button class="btn primary" onclick="document.getElementById('mSeason').classList.add('open')">+ Saison</button></div><div class="grid" style="margin-top:12px">${cur.saisons.map(s=>`<div class="card"><b>${s.name}</b><p style="font-size:11px;color:#777">${s.theme}</p><span class="badge">${cur.episodes.filter(e=>e.saisonId===s.id).length}/${s.count} eps</span><button class="btn" style="margin-top:8px" onclick="openGenM('${s.id}')">+ Générique</button></div>`).join('')||'<p style="opacity:.4">Pas de saison</p>'}</div>`;
 if(curTab==='gens') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Génériques</h3><button class="btn primary" onclick="openGenM()">+ Générique</button></div><div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${cur.generiques.map(g=>{let s=cur.saisons.find(x=>x.id===g.saisonId);return `<div class="card"><b>${g.type.toUpperCase()} — ${s?s.name:''} — ${g.title}</b><p style="font-size:11px;color:#aaa">Musique: ${g.music}</p><p style="font-size:11px;color:#aaa">Visuel: ${g.visual}</p><pre style="font-size:10px;color:#666;white-space:pre-wrap">${g.credits}</pre></div>`}).join('')||'<p style="opacity:.4">Aucun générique</p>'}</div>`;
 if(curTab==='eps') v.innerHTML=`<div style="display:flex;justify-content:space-between"><h3>Épisodes — ${cur.episodes.length}/200</h3><button class="btn ai" onclick="openGenEp()">✨ Générer</button></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${cur.episodes.map((ep,i)=>`<div class="card" style="flex-direction:row;align-items:center"><div style="width:52px;height:52px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;text-align:center">${i+1}<br>${ep.duration||20}'</div><div style="flex:1"><b style="font-size:12px">${ep.title}</b><p style="font-size:11px;color:#777">${ep.prompt.slice(0,80)}...</p></div><button class="btn" onclick="playEp(${i})">▶</button></div>`).join('')||'<p style="opacity:.4">Aucun épisode</p>'}</div>`;
}
function openLore(i=null){
 editLore=i;
 pendingLoreImage='';
 const file=document.getElementById('lImgFile');
 if(file) file.value='';
 const preview=document.getElementById('lImgPreview');
 if(i!==null){
  let l=cur.lore[i];
  document.getElementById('lType').value=l.type;
  document.getElementById('lName').value=l.name;
  document.getElementById('lRole').value=l.role||'';
  document.getElementById('lDesc').value=l.desc||'';
  preview.style.display=l.img?'block':'none';
  if(l.img) getImage(l.img).then(src=>{if(src) document.getElementById('lImgPreviewImg').src=src;});
 } else {
  document.getElementById('lType').value='personnage';
  document.getElementById('lName').value='';
  document.getElementById('lRole').value='';
  document.getElementById('lDesc').value='';
  preview.style.display='none';
 }
 document.getElementById('mLore').classList.add('open');
}
function previewLoreImage(input){
 const f=input.files&&input.files[0];
 if(!f) return;
 if(!f.type.startsWith('image/')) return alert('Choisis un fichier image.');
 if(f.size>6*1024*1024) return alert('Image trop lourde. Maximum : 6 Mo.');
 const reader=new FileReader();
 reader.onload=()=>{
  pendingLoreImage=reader.result;
  document.getElementById('lImgPreviewImg').src=pendingLoreImage;
  document.getElementById('lImgPreview').style.display='block';
 };
 reader.readAsDataURL(f);
}
async function clearLoreImage(){
 if(editLore!==null && cur.lore[editLore] && cur.lore[editLore].img){
  await deleteImage(cur.lore[editLore].img);
 }
 pendingLoreImage='';
 const file=document.getElementById('lImgFile');
 if(file) file.value='';
 document.getElementById('lImgPreview').style.display='none';
}
async function saveLore(){
 let n=document.getElementById('lName').value.trim();
 if(!n) return alert('Nom requis');
 let old=editLore!==null?cur.lore[editLore]:null;
 let imgKey=old?old.img||'':'';
 if(pendingLoreImage){
  imgKey=await saveImage(pendingLoreImage);
  if(old&&old.img) await deleteImage(old.img);
 }
 let e={
  id:old?old.id:Date.now(),
  type:document.getElementById('lType').value,
  name:n,
  role:document.getElementById('lRole').value,
  img:imgKey,
  desc:document.getElementById('lDesc').value
 };
 if(editLore!==null) cur.lore[editLore]=e;
 else cur.lore.push(e);
 closeM('mLore');
 persist();
}
function saveSeason(){ let n=document.getElementById('sName').value.trim(); if(!n) return alert('Nom requis'); cur.saisons.push({id:'s'+Date.now(), name:n, count:parseInt(document.getElementById('sCount').value)||12, theme:document.getElementById('sTheme').value}); closeM('mSeason'); persist(); }
function openGenM(pre=null){ let s=document.getElementById('gSeason'); s.innerHTML=cur.saisons.map(x=>`<option value="${x.id}" ${x.id===pre?'selected':''}>${x.name}</option>`).join(''); document.getElementById('mGen').classList.add('open'); }
function saveGen(){ let sid=document.getElementById('gSeason').value; if(!sid) return alert('Saison requise'); cur.generiques.push({id:'g'+Date.now(), saisonId:sid, type:document.getElementById('gType').value, title:document.getElementById('gTitle').value, music:document.getElementById('gMusic').value, visual:document.getElementById('gVisual').value, credits:document.getElementById('gCredits').value}); closeM('mGen'); persist(); }
function openGenEp(){ if(!cur.saisons.length) return alert('Crée une saison d\'abord'); let sel=document.getElementById('eSeason'); sel.innerHTML=cur.saisons.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''); document.getElementById('mEp').classList.add('open'); }
async function generate(){
 if(cur.episodes.length>=200) return alert('200 max');
 let sid=document.getElementById('eSeason').value, title=document.getElementById('eTitle').value.trim()||`Épisode ${cur.episodes.length+1}`, prompt=document.getElementById('ePrompt').value.trim(), dur=parseInt(document.getElementById('eDur').value)||20;
 if(!prompt) return alert('Prompt requis');
 let state=document.getElementById('genState'); state.innerText='⏳ Génération '+dur+' min...';
 let words=dur<=20?1300:dur<=30?2100:dur<=40?3000:3800;
 let lore=cur.lore.map(l=>`[${l.type}|${l.role}] ${l.name}: ${l.desc}`).join('\n').slice(0,6000);
 let prev=cur.episodes.slice(-4).map(e=>`EP "${e.title}": ${e.summary||e.generated.slice(0,200)}`).join('\n\n');
 let saison=cur.saisons.find(s=>s.id===sid);
 let full=`Tu es showrunner anime. Projet ${cur.type} "${cur.name}" par ${cur.author}. Synopsis: ${cur.synopsis}. Saison: ${saison.name} - ${saison.theme}. Durée ${dur}min ~${words} mots. LORE:\n${lore}\n\nPRECEDENTS:\n${prev}\n\nEPISODE "${title}" - Intention: ${prompt}\nÉcris: TITRE, RESUME 3 lignes, puis SCENARIO complet avec [décors], dialogues, 3 actes, cliffhanger.`;
 try{
  let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'open',messages:[{role:'user',content:full}]})});
  let d=await r.json(); let txt=d.choices?d.choices[0].message.content:await r.text();
  cur.episodes.push({id:'ep'+Date.now(), saisonId:sid, title, prompt, duration:dur, summary:txt.slice(0,300), generated:txt, createdAt:new Date().toISOString()});
  state.innerText='✅ Prêt'; setTimeout(()=>{closeM('mEp'); persist(); go('eps',document.querySelectorAll('.tab')[4]);},500);
 }catch(e){ state.innerText='❌ '+e; cur.episodes.push({id:'ep'+Date.now(), saisonId:sid, title, prompt, duration:dur, summary:prompt, generated:`[OFFLINE ${dur}min] ${title}\n${prompt}\n\nLore:\n${lore.slice(0,800)}`, createdAt:new Date().toISOString()}); persist(); }
}
function playEp(idx){
 let ep=cur.episodes[idx], saison=cur.saisons.find(s=>s.id===ep.saisonId), op=cur.generiques.find(g=>g.saisonId===ep.saisonId&&g.type==='opening'), ed=cur.generiques.find(g=>g.saisonId===ep.saisonId&&g.type==='ending');
 let v=document.getElementById('view'); v.innerHTML=`<div class="player"><div class="screen" id="scr"></div><div style="padding:10px;display:flex;gap:6px"><button class="btn" onclick="render()">←</button><button class="btn primary" onclick="next()">Suivant →</button><span style="margin-left:auto;font-size:11px;color:#666">${ep.title} • ${ep.duration} min</span></div></div>`;
 let screens=[]; screens.push({h:`<h1>C.N. ANIMATION</h1>`}); screens.push({h:`<h2>Histoire originale de</h2><h1 style="font-size:42px">${cur.author}</h1>`});
 if(op) screens.push({h:`<div style="max-width:600px"><h2 style="color:#a78bfa">🎵 ${op.title}</h2><p style="font-size:12px;margin-top:8px">Musique: ${op.music}</p><p style="font-size:12px">Visuel: ${op.visual}</p><div style="margin-top:12px;font-size:11px">${op.credits.split('\n').join('<br>')}</div></div>`});
 ep.generated.split('\n\n').forEach(c=>{ if(c.trim().length>10) screens.push({h:`<div style="text-align:left;max-width:700px;white-space:pre-wrap;font-size:13px;line-height:20px">${c.replace(/</g,'&lt;')}</div>`}); });
 if(ed) screens.push({h:`<div style="max-width:600px"><h2 style="color:#f472b6">🎵 ${ed.title}</h2><p style="font-size:12px">Musique: ${ed.music}</p><p style="font-size:12px">Visuel: ${ed.visual}</p><div style="margin-top:12px;font-size:11px">${ed.credits.split('\n').join('<br>')}</div></div>`});
 screens.push({h:`<h1>FIN</h1><p>${ep.title}</p>`});
 let i=0; function show(k){document.getElementById('scr').innerHTML=screens[k].h} window.next=()=>{i++; if(i<screens.length) show(i)}; show(0);
}
function exportCurrent(){ if(!cur) return; let b=new Blob([JSON.stringify(cur,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=cur.name.replace(/\s+/g,'_')+'.json'; a.click(); }

loadProjects(); renderList(); render();
</script>
</body>
